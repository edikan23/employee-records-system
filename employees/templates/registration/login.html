{% extends 'employees/base.html' %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
<form method="post" class="panel form narrow">{% csrf_token %}
  {{ form.non_field_errors }}
  {% for f in form %}<div class="field"><label for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}{% for e in f.errors %}<small class="err">{{ e }}</small>{% endfor %}</div>{% endfor %}
  <button class="btn">Sign in</button>
  <p class="muted">No account? <a href="{% url 'signup' %}">Create one</a>.</p>
</form>
{% endblock %}
